name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    name: windows installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the installer
        run: pnpm run dist:win

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: HongguoDesktop-windows-x64
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macos dmg (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the DMG and zip
        run: pnpm run dist:mac

      - name: Upload the DMG and zip
        uses: actions/upload-artifact@v7
        with:
          name: HongguoDesktop-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --title "$GITHUB_REF_NAME" --generate-notes
